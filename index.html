<!DOCTYPE html>दोनों 
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance</title>
<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th {
    background: #333;
    color: white;
}

select {
    padding: 6px;
}

.present {
    background: #c8f7c5;
}

.absent {
    background: #ffc7c7;
}
</style>
</head>

<body>

<h1>📚 Student Attendance</h1>

<table>
<tr>
    <th>Roll No.</th>
    <th>Student Name</th>
    <th>Attendance</th>
</tr>

<tr>
    <td>1</td>
    <td>Rahul</td>
    <td>
        <select onchange="attendance(this)">
            <option value="">Select</option>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
        </select>
    </td>
</tr>

<tr>
    <td>2</td>
    <td>Mohan</td>
    <td>
        <select onchange="attendance(this)">
            <option value="">Select</option>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
        </select>
    </td>
</tr>

<tr>
    <td>3</td>
    <td>Sita</td>
    <td>
        <select onchange="attendance(this)">
            <option value="">Select</option>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
        </select>
    </td>
</tr>

</table>

<script>
function attendance(select) {
    if (select.value === "Present") {
        select.className = "present";
    } else if (select.value === "Absent") {
        select.className = "absent";
    } else {
        select.className = "";
    }
}
</script>

</body>
</html>
